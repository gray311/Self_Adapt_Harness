type: tool
name: edit_harness_file
description: >-
  Modify one inspected H2 file. Either replace old_text exactly once using
  old_text + new_text, or append a small new section using append_text. The
  append mode is the reliable choice for task-specific prompt.md guidance.
input_schema:
  type: object
  properties:
    path:
      type: string
      description: Relative path to an existing mutable H2 file.
    old_text:
      type: string
      description: Exact current text that must occur once.
    new_text:
      type: string
      description: Replacement text; use an empty string to remove the match.
    append_text:
      type: string
      description: >-
        Text to append as a new section. Do not combine it with old_text or
        new_text. Prefer this for a concise task-specific prompt.md addition.
  required: [path]
  additionalProperties: false
